<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-label="About Sirine Dahmane: Software Engineering student at ESPRIT, License in Business Intelligence, full-stack, DevOps and BI, former Tunisian National Taekwondo Team member, speaks Arabic, French and English, seeking a 6-month end-of-studies internship.">
