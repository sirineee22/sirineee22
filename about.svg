</style>

<rect x="2" y="2" width="816" height="386" rx="16" fill="#12101a" stroke="url(#edge)" stroke-width="2"/>

<circle cx="34" cy="30" r="6" fill="#f5576c"/>
<circle cx="56" cy="30" r="6" fill="#f2b24c"/>
<circle cx="78" cy="30" r="6" fill="#4fd1b0"/>
