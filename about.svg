  <clipPath id="c4"><rect x="0" y="212" height="28" width="0"><animate attributeName="width" from="0" to="820" dur="0.8s" begin="3.8s" fill="freeze"/></rect></clipPath>
  <clipPath id="c5"><rect x="0" y="242" height="28" width="0"><animate attributeName="width" from="0" to="820" dur="0.8s" begin="4.6s" fill="freeze"/></rect></clipPath>
  <clipPath id="c6"><rect x="0" y="272" height="28" width="0"><animate attributeName="width" from="0" to="820" dur="0.8s" begin="5.4s" fill="freeze"/></rect></clipPath>
  <clipPath id="c7"><rect x="0" y="302" height="28" width="0"><animate attributeName="width" from="0" to="820" dur="1.2s" begin="6.2s" fill="freeze"/></rect></clipPath>
