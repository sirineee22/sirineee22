<svg xmlns="http://www.w3.org/2000/svg" width="820" height="64" viewBox="0 0 820 64" role="img" aria-label="Internship projects">
<defs>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f093fb"/><stop offset="1" stop-color="#f5576c"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8b8699" stop-opacity="0.35"/>
<stop offset="0.4" stop-color="#8b8699" stop-opacity="0.35"/>
<stop offset="0.5" stop-color="#f5576c"/>
<stop offset="0.6" stop-color="#8b8699" stop-opacity="0.35"/>
<stop offset="1" stop-color="#8b8699" stop-opacity="0.35"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.2s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<circle cx="12" cy="28" r="5" fill="#f5576c">
<animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
</circle>
<g opacity="0">
<text x="34" y="38" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="url(#tg)">Internship projects</text>
<animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" dur="0.7s" fill="freeze"/>
</g>
<rect x="0" y="52" width="820" height="3" rx="1.5" fill="url(#shine)"/>
</svg>
